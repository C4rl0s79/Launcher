appId: app.lumen.launcher
productName: Lumen
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
# EmuStart engine (built by npm run build:engine) and EmuStart's UI for the fullscreen mode
extraResources:
  - from: engine/dist/EmuStartEngine
    to: engine/EmuStartEngine
  - from: engine/web
    to: engine/web
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumen
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.exe
