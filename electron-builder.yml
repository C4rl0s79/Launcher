appId: app.lumen.launcher
productName: Lumen
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
# EmuStart engine (built by npm run build:engine) and EmuStart's UI for the fullscreen mode
extraResources:
  - from: engine/dist/EmuStartEngine
    to: engine/EmuStartEngine
  - from: engine/web
    to: engine/web
win:
  icon: resources/icon.png
  # folder version = „portable”: rozpakuj gdziekolwiek, dane obok (bez AppData i Temp)
  artifactName: ${productName}-${version}-portable.${ext}
  target:
    - target: nsis
      arch: [x64]
    # folder version: unpack anywhere — program and LumenData stay in that one folder
    - target: zip
      arch: [x64]
nsis:
  # keeps LumenData (user data next to Lumen.exe) on uninstall and update
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumen
  artifactName: ${productName}-${version}-setup.${ext}
